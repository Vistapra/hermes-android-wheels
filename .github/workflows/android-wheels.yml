name: android-wheels

# Builds cp314 Android wheels (android_24_arm64_v8a + android_24_x86_64) for the native
# dependencies of hermes-agent v0.23.1 that PyPI does not provide. See packages.json.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-wheels-${{ github.ref }}
  cancel-in-progress: true

env:
  CIBUILDWHEEL_VERSION: "4.3.5"
  ANDROID_API_LEVEL: "24"

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      include: ${{ steps.gen.outputs.include }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: gen
        run: python3 scripts/matrix.py >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    name: ${{ matrix.name }} ${{ matrix.version }} (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.matrix.outputs.include) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # cibuildwheel's Android platform needs a build-machine Python of the target version.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Rust target
        if: matrix.rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.rust_target }}

      - name: Fetch pinned source
        run: python scripts/fetch_source.py "${{ matrix.name }}" "$RUNNER_TEMP/src"

      - name: Fetch native build dependencies
        if: matrix.deps != ''
        run: python scripts/fetch_deps.py "${{ matrix.triplet }}" "$RUNNER_TEMP/deps" ${{ matrix.deps }}

      - name: Build wheel
        env:
          DEPS_DIR: ${{ runner.temp }}/deps
          PKG_ENVIRONMENT: ${{ matrix.environment }}
          PKG_CONFIG_SETTINGS: ${{ matrix.config_settings }}
          PKG_BEFORE_ALL: ${{ matrix.before_all }}
          PKG_PREPARE: ${{ matrix.prepare }}
          HNA_PACKAGE: ${{ matrix.name }}
          CIBW_BUILD: "cp314-*"
          CIBW_TEST_SKIP: "*"
          CIBW_BUILD_VERBOSITY: "1"
        run: |
          if [ -n "$PKG_ENVIRONMENT" ]; then export CIBW_ENVIRONMENT_ANDROID="$PKG_ENVIRONMENT"; fi
          if [ -n "$PKG_CONFIG_SETTINGS" ]; then export CIBW_CONFIG_SETTINGS="$PKG_CONFIG_SETTINGS"; fi
          if [ -n "$PKG_BEFORE_ALL" ]; then export CIBW_BEFORE_ALL="$PKG_BEFORE_ALL"; fi
          if [ "$PKG_PREPARE" = "true" ]; then
            export CIBW_BEFORE_BUILD="sh $GITHUB_WORKSPACE/scripts/android_before_build.sh"
          fi
          set -o pipefail
          pipx run "cibuildwheel==$CIBUILDWHEEL_VERSION" --platform android --archs "${{ matrix.arch }}" \
            --output-dir wheelhouse "$RUNNER_TEMP/src" 2>&1 | tee "$RUNNER_TEMP/build.log"
          ls -l wheelhouse

      # Android resolves an extension's Py* symbols only through its own DT_NEEDED entries.
      - name: Link extensions against libpython
        run: |
          python -m pip install --quiet patchelf wheel
          for w in wheelhouse/*.whl; do
            python scripts/repair_android_wheel.py "$w" libpython3.14.so
          done

      # Job logs need a GitHub login to read; keep the tail of a failed build so the release job
      # can attach it.
      - name: Keep failed build log
        if: failure()
        run: tail -n 400 "$RUNNER_TEMP/build.log" > "log-${{ matrix.name }}-${{ matrix.arch }}.txt" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: log-${{ matrix.name }}-${{ matrix.arch }}
          path: log-${{ matrix.name }}-${{ matrix.arch }}.txt
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-${{ matrix.name }}-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14

  collect:
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: wheelhouse
      - name: Checksums and report
        run: |
          mkdir -p wheelhouse
          cd wheelhouse
          ls -1 *.whl > /dev/null 2>&1 && sha256sum *.whl > SHA256SUMS || : > SHA256SUMS
          cd ..
          python3 - <<'EOF'
          import json, os, pathlib, re, sys
          cfg = json.load(open("packages.json"))
          have = [p.name for p in pathlib.Path("wheelhouse").glob("*.whl")]
          rows, missing_required = [], []
          for pkg in cfg["packages"]:
              stem = re.sub(r"[-_.]+", "_", pkg["name"]).lower()
              for arch in cfg["archs"]:
                  tag = f"android_{cfg['android_api_level']}_{arch['arch']}"
                  hit = [w for w in have if w.lower().startswith(stem + "-") and tag in w]
                  rows.append((pkg["name"], pkg["version"], pkg["tier"], arch["arch"], hit[0] if hit else "MISSING"))
                  if not hit and pkg["tier"] == 1:
                      missing_required.append(f"{pkg['name']} ({arch['arch']})")
          report = {"upstream": "hermes-agent v0.23.1", "wheels": [dict(zip(("name", "version", "tier", "arch", "wheel"), r)) for r in rows]}
          pathlib.Path("wheelhouse/build-report.json").write_text(json.dumps(report, indent=1))
          lines = ["| package | version | tier | arch | wheel |", "|---|---|---|---|---|"]
          lines += [f"| {n} | {v} | {t} | {a} | {w} |" for n, v, t, a, w in rows]
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write("\n".join(lines) + "\n")
          print("\n".join(lines))
          if missing_required:
              sys.exit("tier-1 wheels missing: " + ", ".join(missing_required))
          EOF
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: wheelhouse
          path: wheelhouse/
          retention-days: 30

  # Artifacts can only be downloaded with a GitHub login; a release is fetchable anonymously.
  release:
    needs: collect
    if: always() && needs.collect.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wheelhouse
          path: wheelhouse
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: log-*
          merge-multiple: true
          path: logs
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="wheelhouse-r${{ github.run_number }}"
          shopt -s nullglob
          files=(wheelhouse/* logs/*.txt)
          gh release create "$tag" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Android cp314 wheels (run ${{ github.run_number }})" \
            --notes "Wheels for the native dependencies of hermes-agent v0.23.1 (see packages.json and build-report.json). Built from pinned sources by this workflow at $GITHUB_SHA. log-*.txt are tails of failed experimental builds."
